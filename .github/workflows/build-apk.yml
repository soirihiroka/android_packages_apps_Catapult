name: Build APK

on: 
  push:
    branches: 
      - lineage-23.0
  pull_request: 
    branches:
      - lineage-23.0

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Removed './gradlew build' to bypass strict Lint checks
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Catapult-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Reports (If failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
