name: Build and Auto-Release APK

on: 
  push:
    branches: 
      - lineage-23.0
  pull_request: 
    branches:
      - lineage-23.0

# Required to allow the runner to create releases and upload files
permissions:
  contents: write

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # Optional: Keeps the APK in the Actions tab for 90 days
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catapult-Build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/lineage-23.0'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ### Automated Build
            - **Branch:** ${{ github.ref_name }}
            - **Commit:** ${{ github.sha }}
            - **Build Number:** ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
